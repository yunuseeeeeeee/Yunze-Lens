name: Unpack and build
on:
  push:
    paths: ['project.zip']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack project.zip into the repo
        run: |
          if [ -f project.zip ]; then
            rm -rf www worker resources package.json capacitor.config.json SETUP.md
            unzip -o project.zip -x "__MACOSX/*"
            rm project.zip
            git config user.name "github-actions"; git config user.email "actions@github.com"
            git add -A; git commit -m "Unpack project" || true; git push || true
          fi
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - run: npm install
      - run: npx cap add android
      - name: Camera permission and icons
        run: |
          sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA" />\n    <application#' android/app/src/main/AndroidManifest.xml
          npx capacitor-assets generate --android --iconBackgroundColor '#4F46E5' --iconBackgroundColorDark '#4F46E5'
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: YunzeLens-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
